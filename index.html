<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="calculator-container">
        <div class="total-container">
            <strong id="brand">CAZIO</strong>
            <div id="display-zone">
                <h2 id="total">0</h2>
            </div>
        </div>

        <div class="buttons-container">
            <div class="numbers-container"></div>
            <div class="operations-container">
                <button class="btn operation-btn" value="+">+</button>
                <button class="btn operation-btn" value="-">-</button>
                <button class="btn operation-btn" value="*">x</button>
                <button class="btn operation-btn" value="/">/</button>
                <button class="btn operation-btn delete" value="=">=</button>
                <button class="btn operation-btn delete" value="clear">CLR</button>
            </div>
        </div>
    </div>
</body>

</html>
